services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lgym_express
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lgym_express"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lgym_express?schema=public
      JWT_SECRET: change-me-in-real-environments
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
