name: Coach CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: liftcontext-coach/package-lock.json
      - working-directory: liftcontext-coach
        run: npm ci
      - working-directory: liftcontext-coach
        run: npm run lint
      - working-directory: liftcontext-coach
        run: npm run typecheck
      - working-directory: liftcontext-coach
        run: npm run test
      - working-directory: liftcontext-coach
        run: npm run build
